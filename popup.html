<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>流存 · M3U8 视频下载</title>
  <link rel="stylesheet" href="styles.css">
  <script src="popup.js" type="module"></script>
</head>
<body class="popup">
  <header class="brand"><img src="icons/icon48.png" width="38" height="38" alt=""><div><h1>流存<span class="tag">HLS</span></h1><p>把正在看的，留在本地。</p></div></header>
  <main>
    <section class="page-summary"><span class="eyebrow">当前页面</span><p id="page-title">正在获取页面…</p><div class="toolbar"><span id="count">0 个视频源</span><button id="scan" class="text-button" type="button">↻ 重新扫描</button></div></section>
    <p id="notice" class="notice" role="status" aria-live="polite"></p>
    <div id="media-list" class="media-list"></div>
    <section id="empty" class="empty" hidden><div class="empty-symbol" aria-hidden="true">↓</div><h2>等待视频出现</h2><p>先在页面播放视频，再重新扫描。<br>安装扩展前已加载的请求可能需要刷新页面。</p></section>
    <form id="manual-form" class="manual-form"><label for="manual-url">也可以粘贴 M3U8 地址</label><div class="input-row"><input id="manual-url" type="url" required placeholder="https://…/index.m3u8" autocomplete="off" spellcheck="false"><button type="submit" class="primary">打开</button></div></form>
  </main>
  <footer><span class="status-dot"></span>本地处理 · 无需上传视频<button id="manager" class="text-button" type="button">下载管理 ↗</button></footer>
</body>
</html>
